<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#000000">
<title>Deur</title>
<style>
  :root {
    --u: 8px; --c: #30d158;
    --bg: #000; --s1: #111113; --s2: #1c1c1f; --line: #26262a; --fg: #f5f5f7; --dim: #9a9aa2; --mute: #5c5c64; --on: #000;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { overflow: hidden; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  body.idle { cursor: none; }
  body.visit { overflow: auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  svg.i { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #app { position: fixed; top: 0; left: 0; display: flex; flex-direction: column; padding: calc(var(--u)*4.5); gap: calc(var(--u)*3); overflow: hidden; transform-origin: top left;
    background: radial-gradient(80% 50% at 50% 32%, color-mix(in srgb, var(--c) 12%, transparent), transparent 75%), var(--bg); transition: background 1s; }
  #app.landscape { background: radial-gradient(55% 75% at 28% 50%, color-mix(in srgb, var(--c) 12%, transparent), transparent 75%), var(--bg); }
  body.visit #app { position: relative; min-height: 100vh; overflow: visible; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u)*2); color: var(--dim); font-size: calc(var(--u)*2.6); font-weight: 500; }
  #name { color: var(--fg); font-weight: 600; }
  #subtitle { margin-left: calc(var(--u)*1.2); }
  #time { font-variant-numeric: tabular-nums; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u)*4); }
  #app.landscape main { display: grid; grid-template-columns: 1.2fr 1fr; gap: calc(var(--u)*6); align-items: center; }

  /* status */
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: calc(var(--u)*1.4); min-height: 0; }
  .ring { width: calc(var(--u)*3.4); height: calc(var(--u)*3.4); border-radius: 50%; background: var(--c); box-shadow: 0 0 calc(var(--u)*4) var(--c); animation: breathe 3.6s ease-in-out infinite; margin-bottom: calc(var(--u)*2); }
  @keyframes breathe { 50% { box-shadow: 0 0 calc(var(--u)*1.5) var(--c); } }
  .ring.ding { animation: ding .5s ease-in-out 4; }
  @keyframes ding { 50% { transform: scale(1.8); box-shadow: 0 0 calc(var(--u)*7) var(--c); } }
  #label { font-size: calc(var(--u)*17); font-weight: 800; letter-spacing: -.045em; line-height: .92; color: var(--c); white-space: nowrap; max-width: 100%; }
  #app.portrait #label { font-size: calc(var(--u)*20); }
  #until { font-size: calc(var(--u)*4.2); font-weight: 600; letter-spacing: -.02em; line-height: 1.15; max-width: 22ch; text-wrap: balance; margin-top: calc(var(--u)*.6); }
  #untilAt { font-size: calc(var(--u)*3); color: var(--c); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: calc(var(--u)*-.4); }
  #until:empty, #untilAt:empty { display: none; }
  #message { font-size: calc(var(--u)*2.8); color: var(--dim); max-width: 24ch; text-wrap: balance; line-height: 1.3; }
  #note { font-size: calc(var(--u)*3.3); font-weight: 600; line-height: 1.3; color: var(--fg); background: var(--s1); border-radius: calc(var(--u)*2.2); padding: calc(var(--u)*2) calc(var(--u)*3); max-width: 30ch; text-wrap: balance; margin-top: calc(var(--u)*2); }
  #note:empty { display: none; }
  #extra { font-size: calc(var(--u)*2.2); color: var(--mute); margin-top: calc(var(--u)*1.2); }
  #extra:empty { display: none; }

  /* visitors */
  .ask { display: flex; flex-direction: column; gap: calc(var(--u)*1.2); }
  .ask h2 { margin: 0 0 calc(var(--u)*.8); font-size: calc(var(--u)*2.6); font-weight: 600; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u)*1.2); }
  .tile { display: flex; align-items: center; justify-content: center; gap: calc(var(--u)*1.2); background: var(--s1); border-radius: calc(var(--u)*2); padding: calc(var(--u)*2.6) calc(var(--u)*1.6); font-size: calc(var(--u)*2.5); font-weight: 600; transition: transform .12s, background .12s; }
  .tile:active { transform: scale(.97); background: var(--s2); }
  .tile svg { color: var(--c); }
  .tile.wait { color: var(--mute); }
  .tile.wait svg { color: var(--mute); }
  .tile.wide { grid-column: 1 / -1; }
  #reasons:empty { display: none; }
  #actions .tile { flex-direction: column; gap: calc(var(--u)*1.4); padding: calc(var(--u)*3.4) calc(var(--u)*1.2); font-size: calc(var(--u)*2.6); }
  #actions .tile svg { width: 1.6em; height: 1.6em; }

  /* sheet */
  #modal { position: absolute; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; padding: calc(var(--u)*3); z-index: 20; }
  body.visit #modal { position: fixed; }
  #modal.open { display: flex; }
  .sheet { background: var(--s1); border-radius: calc(var(--u)*3); padding: calc(var(--u)*3.5); width: 100%; max-width: calc(var(--u)*88); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: calc(var(--u)*1.6); animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(calc(var(--u)*1.5)); } }
  .sheet h3 { margin: 0 0 calc(var(--u)*.6); font-size: calc(var(--u)*3.4); font-weight: 700; letter-spacing: -.02em; }
  .sheet input, .sheet textarea { width: 100%; font: inherit; font-size: calc(var(--u)*2.7); padding: calc(var(--u)*1.7) calc(var(--u)*2); border-radius: calc(var(--u)*1.5); border: 1px solid var(--line); background: var(--bg); color: var(--fg); user-select: text; -webkit-user-select: text; }
  .sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--dim); }
  .sheet textarea { min-height: 4em; resize: none; }
  .btns { display: flex; gap: calc(var(--u)*1.2); margin-top: calc(var(--u)*.6); }
  .btns > * { flex: 1; }
  .btn { padding: calc(var(--u)*2); border-radius: calc(var(--u)*1.5); font-size: calc(var(--u)*2.5); font-weight: 600; background: var(--s2); }
  .btn.go { background: var(--fg); color: var(--on); }
  .btn:disabled { opacity: .4; }
  .err { color: #ff453a; font-size: calc(var(--u)*2.1); font-weight: 600; }
  .err:empty { display: none; }
  .day { font-size: calc(var(--u)*2); font-weight: 600; color: var(--dim); margin: calc(var(--u)*.8) 0 calc(var(--u)*.6); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u)*11.5), 1fr)); gap: calc(var(--u)*.8); }
  .slot { padding: calc(var(--u)*1.4) 0; border-radius: calc(var(--u)*1.2); background: var(--bg); font-size: calc(var(--u)*2.2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .slot.sel { background: var(--fg); color: var(--on); }
  .daytabs { display: flex; gap: calc(var(--u)*.8); overflow-x: auto; scrollbar-width: none; }
  .daytab { flex: none; padding: calc(var(--u)*1.2) calc(var(--u)*2.2); border-radius: 999px; background: var(--s2); font-size: calc(var(--u)*2.2); font-weight: 600; }
  .daytab.sel { background: var(--fg); color: var(--on); }
  .sheet.book .slots { min-height: calc(var(--u)*12); }
  .picked { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u)*1.5); background: var(--bg); border-radius: calc(var(--u)*1.5); padding: calc(var(--u)*1.6) calc(var(--u)*2); font-size: calc(var(--u)*2.6); font-weight: 650; }
  .row-links { display: flex; gap: calc(var(--u)*3); flex-wrap: wrap; justify-content: center; }
  .link { color: var(--c); font-size: calc(var(--u)*2.2); font-weight: 600; }
  .muted { color: var(--dim); font-size: calc(var(--u)*2.2); margin: 0; }
  .done { align-items: center; text-align: center; padding: calc(var(--u)*5) calc(var(--u)*3.5); gap: calc(var(--u)*1.4); }
  .badge { width: calc(var(--u)*10); height: calc(var(--u)*10); border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); font-size: calc(var(--u)*5); margin-bottom: calc(var(--u)*1); }
  .wait-line { display: flex; align-items: center; gap: calc(var(--u)*1.2); color: var(--dim); font-size: calc(var(--u)*2.2); }
  .spin { width: calc(var(--u)*2.2); height: calc(var(--u)*2.2); border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--dim); animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reply { font-size: calc(var(--u)*4.6); font-weight: 750; letter-spacing: -.025em; line-height: 1.12; text-wrap: balance; }

  /* keyboard */
  .kb { display: grid; gap: calc(var(--u)*.7); }
  .kr { display: flex; gap: calc(var(--u)*.7); justify-content: center; }
  .kb button { flex: 1; max-width: calc(var(--u)*7.6); padding: calc(var(--u)*1.5) 0; border-radius: calc(var(--u)*1); background: var(--s2); font-size: calc(var(--u)*2.3); }
  .kb button.w { max-width: none; flex: 1.8; } .kb button.ww { max-width: none; flex: 6; }
  .kb button:active { background: var(--fg); color: var(--on); }

  #toast { position: absolute; left: 50%; bottom: calc(var(--u)*4); transform: translateX(-50%); background: var(--fg); color: var(--on); padding: calc(var(--u)*1.4) calc(var(--u)*2.8); border-radius: 999px; font-size: calc(var(--u)*2.2); font-weight: 600; opacity: 0; transition: opacity .25s; z-index: 40; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #offline { position: absolute; top: calc(var(--u)*1.5); left: 50%; transform: translateX(-50%); font-size: calc(var(--u)*1.8); color: var(--dim); background: var(--s2); padding: calc(var(--u)*.6) calc(var(--u)*1.8); border-radius: 999px; z-index: 35; display: none; }
  #offline.show { display: block; }
  #dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s; z-index: 30; }
  #dim.on { pointer-events: auto; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #5c5c64; font: 500 16px system-ui, sans-serif; background: #000; z-index: 100; }
  #powerBanner { position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: var(--busy-bg, #ff9f0a); color: #000; text-align: center; font-weight: 700; padding: 12px 16px; font-size: 20px; }
  .hidden { display: none !important; }
  .hr { display: flex; align-items: baseline; gap: calc(var(--u)*2.6); }
  #weather { color: var(--dim); }
  #weather:empty { display: none; }
  #qr { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*1); margin-top: calc(var(--u)*1.5); }
  #qr:empty { display: none; }
  #qr svg { width: calc(var(--u)*17); height: auto; border-radius: calc(var(--u)*1); background: #fff; display: block; }
  #qr small { color: var(--dim); font-size: calc(var(--u)*1.9); text-align: center; max-width: 24ch; }

  /* ---------- layout editor (only with ?edit=1; the normal screen can never be moved) ---------- */
  .blk { max-width: 100%; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
  img.blk { height: auto; object-fit: contain; display: block; }
  .pos-hide { display: none !important; }
  body.editing, body.editing.idle { cursor: default; }
  body.editing .ph:empty { display: block !important; min-width: 8em; min-height: 1.3em; }
  body.editing .ph:empty::before { content: attr(data-ph); opacity: .45; }
  .movable { cursor: move !important; outline: 2px dashed rgba(128,128,128,.8); outline-offset: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .movable.sel { outline: 3px solid #0a84ff; }
  .movable.pos-ghost { opacity: .3; }
  .movable * { pointer-events: none; }
  #editbar { position: fixed; top: 0; left: 0; right: 0; z-index: 500; background: #0a84ff; color: #fff; font: 600 14px/1.3 system-ui, sans-serif; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #editbar button, #editbar input { font: inherit; border-radius: 8px; border: 0; padding: 7px 12px; }
  #editbar button { background: rgba(255,255,255,.22); color: #fff; cursor: pointer; }
  #editbar button.main { background: #fff; color: #0a84ff; }
  #editbar button:disabled { opacity: .45; }
  #editbar input { background: #fff; color: #111; width: 150px; }
  #editbar .grow { flex: 1; }
  #editbar small { font-weight: 500; opacity: .9; }
  #editbar.framed { padding: 5px 8px; gap: 5px; font-size: 12px; }
  #editbar.framed small { display: none; }
  #editbar.framed button, #editbar.framed input { padding: 4px 8px; font-size: 12px; }
  #editbar.framed input { width: 110px; }

  /* ---------- Vraagje: topics, number pad, greeting ---------- */
  .topics { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u)*1); }
  .topic { padding: calc(var(--u)*2.2) calc(var(--u)*1.6); border-radius: calc(var(--u)*1.6); background: var(--s2); font-size: calc(var(--u)*2.5); font-weight: 600; text-align: center; }
  .topic.sel { background: var(--c); color: var(--on); }
  .topic:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .sheet > .link { align-self: flex-start; padding: calc(var(--u)*.6) 0; }
  .sheet.pad { max-width: calc(var(--u)*62); }
  .nrdisp { font-size: calc(var(--u)*5); font-weight: 700; letter-spacing: .14em; text-align: center; padding: calc(var(--u)*1.4); border-radius: calc(var(--u)*1.6); background: var(--bg); font-variant-numeric: tabular-nums; min-height: calc(var(--u)*9); display: grid; place-items: center; }
  .nrdisp .ph { color: var(--mute); letter-spacing: 0; font-weight: 500; font-size: .55em; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*1); }
  .key { display: flex; align-items: center; justify-content: center; padding: calc(var(--u)*2) 0; border-radius: calc(var(--u)*1.6); background: var(--s2); font-size: calc(var(--u)*3.4); font-weight: 600; }
  .key.soft { color: var(--dim); }
  .key.ok { background: var(--c); color: var(--on); }
  .key:disabled { opacity: .35; }
  .hello { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*1.2); text-align: center; padding-top: calc(var(--u)*1); }
  .hello h3 { font-size: calc(var(--u)*4.4); }
  .avatar { width: calc(var(--u)*11); height: calc(var(--u)*11); border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--on); font-size: calc(var(--u)*5); font-weight: 800; }
  .switch { display: flex; align-items: center; gap: calc(var(--u)*1.6); text-align: left; padding: calc(var(--u)*1.6) calc(var(--u)*2); border-radius: calc(var(--u)*1.5); background: var(--bg); font-size: calc(var(--u)*2.3); }
  .switch .knob { flex: none; width: calc(var(--u)*6); height: calc(var(--u)*3.4); border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
  .switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: calc(var(--u)*3.4 - 6px); height: calc(var(--u)*3.4 - 6px); border-radius: 50%; background: #fff; transition: transform .28s cubic-bezier(.2,.9,.3,1.3); }
  .switch.on .knob { background: var(--c); }
  .switch.on .knob::after { transform: translateX(calc(var(--u)*2.6)); }

  /* ---------- motion (never hides anything if an animation can't run) ---------- */
  @property --c { syntax: '<color>'; inherits: true; initial-value: #30d158; }
  html { transition: --c .9s ease; }
  .hero.swap > :not(.ring) { animation: swapIn .6s cubic-bezier(.2,.8,.2,1); }
  .hero.swap > :nth-child(3), .hero.swap > :nth-child(4) { animation-delay: .05s; }
  .hero.swap > :nth-child(n+5) { animation-delay: .1s; }
  @keyframes swapIn { from { transform: translateY(calc(var(--u)*1.6)) scale(.985); opacity: .3; } }
  #modal.open { animation: dimIn .22s ease-out; }
  @keyframes dimIn { from { background: rgba(0,0,0,0); } }
  .sheet { animation: sheetIn .34s cubic-bezier(.2,.9,.25,1.12); }
  @keyframes sheetIn { from { transform: translateY(calc(var(--u)*3)) scale(.97); } }
  .sheet.step { animation: stepIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes stepIn { from { transform: translateX(calc(var(--u)*3)); opacity: .4; } }
  .tile, .topic, .key, .btn, .slot, .daytab, .pill { transition: transform .18s cubic-bezier(.2,.8,.2,1.4), background .15s, color .15s, box-shadow .2s; }
  .tile:active, .topic:active, .key:active, .btn:active, .slot:active, .daytab:active { transform: scale(.95); }
  @media (hover: hover) { .tile:hover { transform: translateY(-2px); } }
  .pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.45); }
  @keyframes pop { from { transform: scale(.6); } }
  .shake { animation: shake .42s; }
  @keyframes shake { 20%, 60% { transform: translateX(calc(var(--u)*-1)); } 40%, 80% { transform: translateX(var(--u)); } }
  #toast { transform: translateX(-50%) translateY(calc(var(--u)*2)); transition: opacity .25s, transform .35s cubic-bezier(.2,.9,.3,1.2); }
  #toast.show { transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

  /* ---------- light theme: bright background, status in a full-colour card ---------- */
  body.light { --bg: #eef0f4; --s1: #ffffff; --s2: #e8eaef; --line: #d9dce3; --fg: #15171b; --dim: #5b616c; --mute: #8a909b; --on: #fff; }
  body.light #app, body.light #app.landscape { background: var(--bg); }
  body.light .hero { background: linear-gradient(150deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 78%, #000)); color: #fff;
    border-radius: calc(var(--u)*4); padding: calc(var(--u)*5) calc(var(--u)*4); box-shadow: 0 calc(var(--u)*2.5) calc(var(--u)*7) color-mix(in srgb, var(--c) 32%, transparent); }
  body.light #app.landscape .hero { align-self: stretch; }
  body.light #label, body.light #untilAt, body.light .hero .link { color: #fff; }
  body.light #message { color: rgba(255,255,255,.88); }
  body.light #extra { color: rgba(255,255,255,.75); }
  body.light .ring { background: #fff; box-shadow: 0 0 calc(var(--u)*3) rgba(255,255,255,.85); }
  body.light #note { background: rgba(255,255,255,.2); color: #fff; }
  body.light header { color: var(--dim); }
  body.light .tile { box-shadow: 0 1px 2px rgba(20,23,27,.06), 0 calc(var(--u)*.8) calc(var(--u)*2.4) rgba(20,23,27,.07); }
  body.light #actions .tile.wait { box-shadow: none; background: var(--s2); }
  body.light #modal { background: rgba(21,23,27,.45); }
  body.light .sheet { box-shadow: 0 calc(var(--u)*3) calc(var(--u)*9) rgba(0,0,0,.22); }
  body.light .sheet input, body.light .sheet textarea, body.light .slot, body.light .picked, body.light .nrdisp, body.light .switch { background: var(--s2); border-color: transparent; }
  body.light .key, body.light .topic { background: var(--s2); }
  body.light .sheet input:focus, body.light .sheet textarea:focus { border-color: var(--c); background: #fff; }

  /* ---------- look: chosen under Ontwerp → Weergave (body carries data-* attributes) ---------- */
  body[data-font="rounded"] { font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif; }
  body[data-font="serif"] { font-family: "New York", Georgia, "Times New Roman", serif; }
  body[data-font="mono"] { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body[data-font="readable"] { font-family: Verdana, "Atkinson Hyperlegible", "Trebuchet MS", sans-serif; letter-spacing: .01em; }
  body[data-weight="light"] #label { font-weight: 300; } body[data-weight="bold"] #label { font-weight: 900; } body[data-weight="bold"] { font-weight: 600; }
  body[data-transition="none"] .hero.swap > :not(.ring) { animation: none; }
  body[data-transition="fade"] .hero.swap > :not(.ring) { animation: fadeIn .8s ease; }
  body[data-transition="zoom"] .hero.swap > :not(.ring) { animation: zoomIn .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeIn { from { opacity: 0; } } @keyframes zoomIn { from { transform: scale(.82); opacity: .2; } }
  body[data-cards="flat"] .tile, body[data-cards="flat"] .topic { box-shadow: none; background: var(--s2); }
  body[data-cards="outline"] .tile, body[data-cards="outline"] .topic { background: transparent; box-shadow: none; border: calc(var(--u)*.35) solid var(--line); }
  body[data-cards="glass"] .tile, body[data-cards="glass"] .topic { background: color-mix(in srgb, var(--fg) 9%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: none; }

<script>

    const first = $('sheet').querySelector('input,textarea');
    activeInput = first || null;
    $('sheet').querySelectorAll('.kb').forEach((k) => k.redraw?.());
    if (first && !useKB()) setTimeout(() => first.focus(), 60);
  }
  function closeSheet() { $('modal').classList.remove('open'); pending = null; activeInput = null; clearTimeout(idleTimer); }
  function bumpIdle(ms = 60000) { clearTimeout(idleTimer); idleTimer = setTimeout(closeSheet, ms); }
  $('modal').addEventListener('pointerdown', (e) => { if (e.target === $('modal')) closeSheet(); else bumpIdle(pending ? 300000 : 60000); });
  $('modal').addEventListener('focusin', (e) => { if (e.target.matches('input,textarea')) activeInput = e.target; });

  function field(tag, props) {
    const el = h(tag, { ...props, inputmode: useKB() ? 'none' : null, autocomplete: 'off', spellcheck: 'false' });
    el.addEventListener('pointerdown', () => { activeInput = el; document.querySelectorAll('.kb').forEach((k) => k.redraw?.(el.type === 'email')); });
    el.addEventListener('focus', () => { document.querySelectorAll('.kb').forEach((k) => k.redraw?.(el.type === 'email')); });

  }
  function keyboard() {

      ...['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'].map((row) => h('div', { class: 'kr' }, ...[...row].map((ch) => {
        const c = shift ? ch.toUpperCase() : ch;

      }))),
      activeInput?.type === 'tel' ? h('div', { class: 'kr' }, ...['+', '-', '(', ')'].map((x) => h('button', { onpointerdown: press((el) => { el.value += x; }) }, x))) : null,
      activeInput?.type === 'email' ? h('div', { class: 'kr' }, ...['@', '-', '_', '.nl', '.com'].map((x) => h('button', { class: x.length > 1 ? 'w' : '', onpointerdown: press((el) => { el.value += x; }) }, x))) : null,
      h('div', { class: 'kr' },
        h('button', { class: 'w', onpointerdown: (e) => { e.preventDefault(); shift = !shift; draw(); } }, shift ? 'abc' : 'ABC'),
        h('button', { onpointerdown: press((el) => { el.value += ','; }) }, ','),
        h('button', { class: 'ww', onpointerdown: press((el) => { el.value += ' '; }) }, 'spatie'),
        h('button', { onpointerdown: press((el) => { el.value += '.'; }) }, '.'),
        h('button', { class: 'w', onpointerdown: press((el) => { el.value = el.value.slice(0, -1); if (!el.value) { shift = true; draw(); } }) }, '⌫'))].filter(Boolean));

  // ---------- what the admin made compulsory (Instellingen → Bezoekersformulier) ----------
  const FORM_DEF = { name: { bell: 'hidden', reason: 'optional', message: 'optional', appointment: 'required', callback: 'required' }, email: { bell: 'hidden', reason: 'hidden', message: 'auto', appointment: 'auto', callback: 'hidden' }, phone: { callback: 'required' } };
  const FORM_OK = { name: ['hidden', 'optional', 'required'], email: ['hidden', 'auto', 'optional', 'required'], phone: ['optional', 'required'] };
  const fm = (f, type) => { const m = S?.settings?.form?.[f]?.[type]; return FORM_OK[f].includes(m) ? m : (FORM_DEF[f]?.[type] || 'hidden'); };
  const formCfg = () => S?.settings?.form || {};
  const showEmail = (type) => { const m = fm('email', type); return m === 'optional' || m === 'required' || (m === 'auto' && !!S?.mailOn); };
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  // the fields for a name and an e-mail address (as far as they are asked), the consent box and the privacy note, with their checks
  function personBlock(type) {
    const nm = fm('name', type), em = fm('email', type), cfg = formCfg();
    const star = (t, m) => (m === 'required' ? t + ' *' : t);
    const name = nm !== 'hidden' ? field('input', { placeholder: star(nm === 'required' ? tx('yourName') : tx('yourNameOpt'), nm), maxlength: 60 }) : null;
    const email = showEmail(type) ? field('input', { type: 'email', placeholder: star(em === 'required' ? 'E-mailadres' : 'E-mail (optioneel) — dan krijg je het antwoord ook per mail', em), maxlength: 120 }) : null;
    let box = null;

    }

      els: [name, email, box && box.el, cfg.privacyNote ? h('div', { class: 'muted', style: 'font-size:.85em;margin:6px 0' }, cfg.privacyNote) : null].filter(Boolean),
      values: () => ({ name: name ? name.value : '', email: email ? email.value.trim() : '', consent: box ? box.input.checked : undefined }),
      check: () => {
        if (name && nm === 'required' && !name.value.trim()) return 'Vul je naam in';
        if (email) { const v = email.value.trim(); if (em === 'required' && !v) return 'Vul je e-mailadres in'; if (v && !EMAIL_RE.test(v)) return 'Dat e-mailadres klopt niet'; }
        if (box && !box.input.checked && ((name && name.value.trim()) || (email && email.value.trim()))) return 'Vink eerst aan dat je akkoord gaat.';
        return '';
      },
    };
  }

  // ---------- sending ----------
  let sending = false;
  async function sendVisit(payload, errEl, btn) {
    if (sending) return;
    sending = true; if (btn) btn.disabled = true;
    if (payload.type === 'bell' && !payload._rang) { chime('bell'); lastLocalRing = Date.now(); payload._rang = true; } // the bell sounds here too when it was sent from a form
    try {
      const res = await fetch('/api/visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...payload, via: VISIT ? 'phone' : 'door' }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || (res.status === 429 ? tx('tryLater') : 'Versturen mislukt — probeer opnieuw'));
      pending = { id: out.id, shown: false, instant: out.reply };
      showSent(payload, out.mailTo);
    } catch (e) {
      const msg = e instanceof TypeError ? 'Geen verbinding — probeer opnieuw' : e.message;
      if (errEl) errEl.textContent = msg; else toast(msg);
    } finally { sending = false; if (btn) btn.disabled = false; }
  }

  // an appointment request as a calendar file (made here in the browser; nothing is sent anywhere)
  function downloadIcs(payload) {
    const z = (t) => new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const len = Math.max(10, Math.min(240, (S && S.settings.slotMinutes) || 30)) * 60000, name = (S && S.settings.name) || 'Deur';
    const text = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Saga Techbox//NL', 'BEGIN:VEVENT', `UID:${Date.now()}@saga-techbox`, `DTSTAMP:${z(Date.now())}`, `DTSTART:${z(payload.at)}`, `DTEND:${z(payload.at + len)}`, `SUMMARY:${lt('Afspraak', 'Appointment')} — ${String(name).replace(/[,;\n]/g, ' ')}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/calendar' })), download: 'afspraak.ics' }); document.body.append(a); a.click(); a.remove();
  }

  function checkReply() {
    if (!pending || pending.shown) return;

  // Terugbellen: name, phone number, and when it suits

  // "Wie ben je?": a number fills in everything; otherwise name (+ e-mail when mail is on)
  // a profile (username + name + e-mail) is remembered on the visitor's own phone only, never on the door screen
  const savedProfile = () => { try { return VISIT ? localStorage.getItem('doorProfile') || '' : ''; } catch { return ''; } };
  const rememberProfile = (nr) => { try { if (VISIT) localStorage.setItem('doorProfile', nr); } catch {} };
  const forgetProfile = () => { try { localStorage.removeItem('doorProfile'); } catch {} };
  async function lookupPerson(nr) {
    const res = await fetch('/api/lookup', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nr, phone: VISIT }) }).then((r) => r.json());
    if (res.error) throw new Error(res.error);
    return res;
  }
  async function whoAreYou(opt) {
    if (VISIT) { // a phone that came before is greeted by name (cookie), no code needed
      try { const me = await fetch('/api/visitor/me', { credentials: 'same-origin' }).then((r) => r.json()); if (me.found) return hello(opt, me.nr, me); } catch {}
    }
    const saved = savedProfile();
    if (saved) {
      try { const res = await lookupPerson(saved); if (res.found) return hello(opt, saved, res); forgetProfile(); } catch {}
    }
    numberPad(opt); // the code pad is always there: anyone with a code can fill it in
  }
  // shared by the number pad and the username form
  async function greet(opt, nr, err, shown) {

      const res = await lookupPerson(nr);

      if (!res.found) { err.textContent = 'Die gebruikersnaam of dat nummer kennen we niet'; if (shown) { shown.classList.remove('shake'); void shown.offsetWidth; shown.classList.add('shake'); } return false; }
      rememberProfile(nr);

  }

  async function greetAfterProfile(opt, digits) { const err = h('div', { class: 'err' }); if (!(await greet(opt, digits, err))) { closeSheet(); toast(err.textContent || tx('tryLater')); } }

  function hello(opt, nr, person) {

      h('span', { class: 'knob' }), h('span', {}, tx('mailAlso', { email: person.email }))) : null;
    openSheet('', h('div', { class: 'hello' }, h('div', { class: 'avatar pop' }, person.name.trim()[0].toUpperCase()), h('h3', {}, tx('hi', { name: person.name.split(' ')[0] }))), opt.summary ? h('div', { class: 'picked' }, h('span', {}, opt.summary)) : null, toggle, err,
      h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: () => { forgetProfile(); S.hasPeople ? numberPad(opt) : userForm(opt); } }, tx('notYou')), go));
  }

  function nameForm(opt) {
    const pb = personBlock(opt.payload.type);
    const err = h('div', { class: 'err' });
    const go = h('button', { class: 'btn go' }, opt.send);
    go.onclick = () => {
      const e = pb.check(); if (e) { err.textContent = e; return; }
      sendVisit({ ...opt.payload, ...pb.values() }, err, go);
    };
    openSheet('', h('h3', {}, opt.title), opt.summary ? h('div', { class: 'picked' }, h('span', {}, opt.summary)) : null, ...pb.els, keyboard(), err,
      h('button', { class: 'link', onclick: () => profileForm(opt) }, 'Profiel maken — dan hoef je dit niet steeds in te vullen'),
      h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: () => (S.hasPeople ? numberPad(opt) : opt.back()) }, tx('back')), go));
  }

  const shortDay = (t) => { const d = dayDiff(t); if (d === 0) return lt('Vandaag', 'Today'); if (d === 1) return lt('Morgen', 'Tomorrow'); const x = new Date(t).toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric', month: 'short' }); return x[0].toUpperCase() + x.slice(1); };

  // step 1: pick a day (tabs) and a time
  async function openAppointment(preselect) {
    let sel = typeof preselect === 'number' ? preselect : null;
    const err = h('div', { class: 'err' });
    const tabs = h('div', { class: 'daytabs' });
    const grid = h('div', { class: 'slots' }, h('div', { class: 'wait-line' }, h('div', { class: 'spin' }), tx('bookLoading')));
    const next = h('button', { class: 'btn go', disabled: !sel }, tx('next'));
    next.onclick = () => { if (sel) whoAreYou({ title: tx('book'), send: tx('request'), summary: `${shortDay(sel)} om ${fmtTime(sel)}`, payload: { type: 'appointment', at: sel }, back: () => openAppointment(sel) }); };
    openSheet('book', h('h3', {}, tx('book')), h('p', { class: 'muted' }, tx('bookHint')), tabs, grid, err,
      h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: closeSheet }, tx('cancel')), next));
    let slots;
    try { ({ slots } = await fetch('/api/slots', { cache: 'no-store' }).then((r) => r.json())); }
    catch { grid.replaceChildren(h('p', { class: 'muted' }, 'Tijden konden niet geladen worden — probeer opnieuw.')); return; }
    if (!slots.length) { tabs.remove(); grid.replaceChildren(h('p', { class: 'muted' }, 'Geen vrije tijden de komende dagen — stel gerust een vraagje.')); return; }
    const days = new Map();
    for (const t of slots) { const k = dayStart(t); if (!days.has(k)) days.set(k, []); days.get(k).push(t); }
    let day = sel && days.has(dayStart(sel)) ? dayStart(sel) : [...days.keys()][0];
    const draw = () => {
      tabs.replaceChildren(...[...days.keys()].map((k) => h('button', { class: 'daytab' + (k === day ? ' sel' : ''), onclick: () => { day = k; draw(); bumpIdle(); } }, shortDay(k))));
      grid.replaceChildren(...days.get(day).map((t) => h('button', { class: 'slot' + (t === sel ? ' sel' : ''), onclick: () => { sel = t; next.disabled = false; err.textContent = ''; draw(); bumpIdle(); } }, fmtTime(t))));
    };
    draw();
  }


  // ---------- "Indeling aanpassen": drag the parts of the screen where you want them ----------
  function startEdit() {
    document.body.classList.add('editing');
    const framed = window.top !== window; // shown inside the control panel's preview
    let tok = '', sel = null, saved = '{}', dirty = false;
    try { tok = sessionStorage.getItem('doorEditToken') || localStorage.getItem('doorToken') || ''; } catch {}
    const bar = h('div', { id: 'editbar', class: framed ? 'framed' : '' });
    document.body.append(bar);
    const headers = () => ({ 'Content-Type': 'application/json', authorization: 'Bearer ' + tok });
    const KEYNAME = { portrait: 'verticaal', landscape: 'horizontaal', phone: 'telefoon' };
    const cur = (id) => ({ x: 0, y: 0, s: 1, hide: false, ...(work[id] || {}) });
    const put = (id, patch) => { work[id] = { ...cur(id), ...patch }; applyPositions(); setDirty(); drawBar(); };
    const setDirty = () => { dirty = JSON.stringify(work) !== saved; };
    const els = () => Object.entries(movable()).map(([id, q]) => [id, document.querySelector(q)]).filter(([, el]) => el);
    const mark = () => els().forEach(([id, el]) => { el.classList.add('movable'); el.classList.toggle('sel', id === sel); });
    const close = () => {
      if (dirty && !confirm('Je wijzigingen zijn nog niet opgeslagen. Toch sluiten?')) return;
      params.delete('edit'); location.href = location.pathname + (params.toString() ? '?' + params : '');
    };
    async function save() {
      const res = await fetch('/api/layout', { method: 'POST', headers: headers(), body: JSON.stringify({ key: workKey, items: work }) });
      if (!res.ok) { toast((await res.json().catch(() => ({}))).error || 'Opslaan lukte niet'); return; }
      saved = JSON.stringify(work); dirty = false; toast('Indeling opgeslagen'); drawBar();
    }
    function drawBar() {
      mark();
      const p = sel ? cur(sel) : null;
      bar.replaceChildren(...[
        h('b', {}, `Indeling aanpassen — ${KEYNAME[workKey] || ''}`),
        sel ? h('span', {}, `· ${nameOf(sel)}`) : h('small', {}, 'Sleep een onderdeel naar een andere plek. Pijltjestoetsen verplaatsen precies.'),
        sel ? h('button', { onclick: () => put(sel, { s: Math.max(0.4, Math.round((p.s - 0.05) * 100) / 100) }) }, '−') : null,
        sel ? h('button', { onclick: () => put(sel, { s: Math.min(2.5, Math.round((p.s + 0.05) * 100) / 100) }) }, '+') : null,
        sel ? h('button', { onclick: () => put(sel, { hide: !p.hide }) }, p.hide ? 'Tonen' : 'Verbergen') : null,
        sel ? h('button', { onclick: () => { delete work[sel]; applyPositions(); setDirty(); drawBar(); } }, 'Dit onderdeel herstellen') : null,
        h('span', { class: 'grow' }),
        h('button', { onclick: () => { work = {}; sel = null; applyPositions(); setDirty(); drawBar(); } }, 'Alles herstellen'),
        h('button', { class: 'main', disabled: !dirty, onclick: save }, 'Opslaan'),
        framed ? null : h('button', { onclick: close }, 'Sluiten')].filter(Boolean));
    }
    function drawLogin(msg) {
      const u = h('input', { placeholder: 'Gebruikersnaam', autocapitalize: 'none' }), pw = h('input', { type: 'password', placeholder: 'Wachtwoord' });
      const go = async () => {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u.value, password: pw.value }) });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) return drawLogin(out.error || 'Inloggen lukte niet');
        tok = out.token; try { sessionStorage.setItem('doorEditToken', tok); } catch {}
        check();
      };
      pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      bar.replaceChildren(...[h('b', {}, 'Inloggen om de indeling aan te passen'), u, pw, h('button', { class: 'main', onclick: go }, 'Inloggen'), msg ? h('span', {}, msg) : null, h('span', { class: 'grow' }), framed ? null : h('button', { onclick: close }, 'Sluiten')].filter(Boolean));
    }
    async function check() {
      try {
        const res = await fetch('/api/me', { headers: headers() });
        if (!res.ok) return drawLogin('');
        const me = await res.json();
        if (!me.perms.includes('settings')) { bar.replaceChildren(h('b', {}, 'Je hebt geen recht om de indeling te wijzigen.'), h('span', { class: 'grow' }), h('button', { onclick: close }, 'Sluiten')); return; }
        work = work || {}; saved = JSON.stringify(work); mark(); drawBar();
      } catch { drawLogin('Geen verbinding met de deurserver'); }
    }
    // dragging (corrected for a rotated screen)
    let drag = null;
    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#editbar') || !work) return;
      const hit = els().find(([, el]) => el.contains(e.target));
      if (!hit) { sel = null; drawBar(); return; }
      e.preventDefault();
      sel = hit[0]; const c = cur(sel);
      drag = { id: sel, x0: e.clientX, y0: e.clientY, ox: c.x, oy: c.y };
      drawBar();
    });
    document.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 8;
      const r = Number(params.get('rotate') ?? S?.settings.layout.rotate ?? 0);
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      const [lx, ly] = r === 90 ? [dy, -dx] : r === 180 ? [-dx, -dy] : r === 270 ? [-dy, dx] : [dx, dy];
      const snap = (v) => Math.max(-100, Math.min(100, Math.round(v * 2) / 2));
      work[drag.id] = { ...cur(drag.id), x: snap(drag.ox + lx / u), y: snap(drag.oy + ly / u) };
      applyPositions(); setDirty();
    });
    const endDrag = () => { if (drag) { drag = null; drawBar(); } };
    document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
    document.addEventListener('keydown', (e) => {
      if (!sel || e.target.closest?.('#editbar input')) return;
      const step = e.shiftKey ? 2 : 0.5, c = cur(sel);
      if (e.key === 'ArrowLeft') put(sel, { x: c.x - step }); else if (e.key === 'ArrowRight') put(sel, { x: c.x + step });
      else if (e.key === 'ArrowUp') put(sel, { y: c.y - step }); else if (e.key === 'ArrowDown') put(sel, { y: c.y + step });
      else if (e.key === '+' || e.key === '=') put(sel, { s: Math.min(2.5, Math.round((c.s + 0.05) * 100) / 100) });
      else if (e.key === '-') put(sel, { s: Math.max(0.4, Math.round((c.s - 0.05) * 100) / 100) });
      else return;
      e.preventDefault();
    });
    // nothing on the screen may do its normal job while editing
    document.addEventListener('click', (e) => { if (!e.target.closest('#editbar')) { e.preventDefault(); e.stopPropagation(); } }, true);
    editHooks.mark = mark;
    drawLogin(''); check();
  }

  // ---------- connection: live updates + fallback polling + watchdog ----------
  let es = null, lastMsg = 0, online = true;
  function apply(data) {
    lastMsg = Date.now();
    if (S && data.build && S.build && data.build !== S.build && !$('modal').classList.contains('open')) { location.reload(); return; }
    S = data;
    offset = S.serverTime - Date.now();
    $('boot').classList.add('hidden');
    setOnline(true);
    render();
    if (EDIT && !document.body.classList.contains('editing')) startEdit();
  }
  // someone rang (here, on another door screen or on the phone page): ring on this screen too
  function onRing() {
    lastMsg = Date.now();
    const ring = document.querySelector('.ring');
    ring.classList.remove('ding'); void ring.offsetWidth; ring.classList.add('ding');
    bellFlash();
    if (Date.now() - lastLocalRing < 5000) return; // this screen already played the bell
    chime('bell');
    if (!$('modal').classList.contains('open')) toast(tx('toastRang'));
  }
  // browsers only allow sound after the first tap; unlock it on any touch
  const unlockAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} };
  document.addEventListener('pointerdown', unlockAudio, { passive: true });

  function setOnline(ok) {
    online = ok;
    clearTimeout(setOnline.t);
    if (ok) $('offline').classList.remove('show');
    else setOnline.t = setTimeout(() => { if (!online) $('offline').classList.add('show'); }, 6000);
  }
  async function poll() {
    try { const r = await fetch('/api/state', { cache: 'no-store' }); if (r.ok) apply(await r.json()); }
    catch { if (!S) $('boot').textContent = 'Deurserver niet bereikbaar — opnieuw proberen…'; }
  }
  function connect() {
    if (es) es.close();
    es = new EventSource('/events?role=display' + (VISIT ? '&visit=1' : ''));
    es.addEventListener('state', (e) => { try { apply(JSON.parse(e.data)); } catch {} });
    es.addEventListener('ping', () => { lastMsg = Date.now(); });
    es.addEventListener('ring', onRing);
    es.onerror = () => setOnline(false);
  }
  setInterval(() => {
    if (Date.now() - lastMsg > 45000) { connect(); poll(); } // live connection went quiet: rebuild it
    else if (!online) poll();
  }, 8000);
  window.addEventListener('online', () => { connect(); poll(); });

  // keep the screen awake, hide the mouse pointer, double-tap the clock for full screen
  async function keepAwake() { try { if (!VISIT && 'wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', keepAwake);
  keepAwake();
  // in the desktop app: five quick clicks or taps in the top-left corner open the app's settings (server/IP, role, account).
  // Invisible, so visitors never see it.
  if (!VISIT && !EDIT && window.doorApp && window.doorApp.openSettings) {
    let n = 0, last = 0;
    document.addEventListener('pointerdown', (e) => {
      if (e.clientX > 90 || e.clientY > 90) { n = 0; return; }
      const now = Date.now();
      n = now - last < 1500 ? n + 1 : 1; last = now;
      if (n >= 5) { n = 0; window.doorApp.openSettings(); }
    }, true);
  }
  // on the Linux image (address ends in ?kiosk=1) there is no desktop app: the same five clicks open the start screen with the addresses
  if (!VISIT && !EDIT && !window.doorApp && /[?&]kiosk=1/.test(location.search)) {
    let n = 0, last = 0;
    document.addEventListener('pointerdown', (e) => {
      if (e.clientX > 90 || e.clientY > 90) { n = 0; return; }
      const now = Date.now();
      n = now - last < 1500 ? n + 1 : 1; last = now;
      if (n >= 5) { n = 0; location.href = '/start'; }
    }, true);
  }
  let idleCursor;
  document.addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleCursor); idleCursor = setTimeout(() => document.body.classList.add('idle'), 4000); });
  $('time').addEventListener('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); });

  // door screen lock-down: no right-click menu, no zooming, no browser shortcuts that leave the page
  if (!VISIT) {
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', 'l', 'n', 't', 'o', 'p', 's'].includes(e.key.toLowerCase())) e.preventDefault(); });
  }

  layout();
  poll();
  connect();
})();
</script>
</body>
</html>
