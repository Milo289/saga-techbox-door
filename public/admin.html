<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Deurbediening</title>
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deur">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root {
    --bg: #000; --s1: #0e0e10; --s2: #18181b; --s3: #232327; --line: #232327; --fg: #f5f5f7; --dim: #a1a1aa; --mute: #63636b; --on: #000; --topbg: rgba(0,0,0,.82);
    --open: #30d158; --closed: #ff453a; --busy: #ff9f0a; --c: #30d158;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; }
  html.light { color-scheme: light; --bg: #f3f4f7; --s1: #ffffff; --s2: #eef0f3; --s3: #e3e5ea; --line: #e1e4ea; --fg: #15171b; --dim: #5b616c; --mute: #8a909b; --on: #fff; --topbg: rgba(255,255,255,.86);
    --open: #1f9d55; --closed: #e0352b; --busy: #e8780c; }
  html.light .card { box-shadow: 0 1px 2px rgba(20,23,27,.04), 0 6px 20px rgba(20,23,27,.05); }
  html.light button:hover { border-color: #c9cdd5; }
  html.light #alert { background: rgba(21,23,27,.4); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--s2); border-radius: 10px; padding: 9px 14px; font-weight: 550; transition: background .12s, border-color .12s, transform .1s; }
  button:hover { border-color: #3a3a40; }
  button:active { transform: scale(.98); }
  button.ghost { background: transparent; }
  button.white { background: var(--accent, var(--fg)); color: var(--on-accent, var(--on)); border-color: transparent; }
  html.compact .card { padding: 12px 14px; } html.compact .block { padding: 7px 0; } html.compact .form { row-gap: 6px; }
  html.sharp .card, html.sharp button, html.sharp input, html.sharp select { border-radius: 7px; }
  button.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
  button.danger { color: var(--closed); }
  button.on { background: var(--accent, var(--fg)); color: var(--on-accent, var(--on)); border-color: transparent; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #4a4a52; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent, var(--fg)); padding: 0; }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  #powerBar { position: sticky; top: 0; z-index: 40; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: var(--busy); color: #000; font-weight: 650; }
  #powerBar button { background: #000; color: #fff; border: 0; border-radius: 10px; padding: 6px 14px; font: inherit; font-weight: 650; cursor: pointer; }
  table.week { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.week th { text-align: left; font-size: 12px; color: var(--dim); font-weight: 600; padding: 4px 4px 6px; }
  table.week td { padding: 3px 4px; } table.week td:first-child { font-weight: 600; white-space: nowrap; }
  table.week input[type=time] { width: 100%; min-width: 92px; padding: 6px 6px; }
  .hidden { display: none !important; }

  .top { position: sticky; top: 0; z-index: 10; background: var(--topbg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
  #conn { width: 7px; height: 7px; border-radius: 50%; background: var(--closed); flex: none; }
  #conn.ok { background: var(--mute); }
  nav { max-width: 960px; margin: 0 auto; padding: 0 10px; display: flex; gap: 4px; }
  nav button { border: 0; background: none; border-radius: 0; padding: 12px 10px 11px; color: var(--mute); border-bottom: 2px solid transparent; font-weight: 600; }
  nav button.cur { color: var(--fg); border-bottom-color: var(--accent, var(--fg)); }
  .badge { background: var(--closed); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 5px; }

  main { max-width: 960px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 14px; }
  .card { background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .card > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--mute); margin: 0 0 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .card > h2 .sp { flex: 1; }
  .muted { color: var(--mute); font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; min-width: 160px; }

  /* now */
  .now { display: flex; align-items: center; gap: 16px; }
  .now .big { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--c); line-height: 1; }
  .now .until { font-size: 20px; font-weight: 600; }
  .now .until .k { color: var(--dim); font-weight: 400; }
  .now .meta { color: var(--mute); font-size: 13px; margin-top: 4px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mode { border-radius: 16px; padding: 18px 12px; text-align: center; background: var(--s2); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mode .n { font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
  .mode .s { font-size: 12.5px; color: var(--dim); font-weight: 500; }
  .mode .d { width: 12px; height: 12px; border-radius: 50%; }
  .mode.cur { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 14%, var(--s1)); }
  .mode.cur .n { color: var(--mc); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .label { font-size: 13px; color: var(--dim); font-weight: 600; min-width: 64px; }
  .block { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .block:first-child { border-top: 0; }
  .block .d { width: 9px; height: 9px; border-radius: 50%; background: var(--busy); flex: none; }
  .block .t { font-weight: 650; font-variant-numeric: tabular-nums; }
  .block .x { margin-left: auto; }
  .block.paused .t::after { content: "gepauzeerd — je hebt de status met de hand gewijzigd"; margin-left: 8px; font-size: 11px; color: var(--dim); font-weight: 500; }
  .block.active .t::after { content: "nu"; margin-left: 8px; font-size: 11px; background: var(--busy); color: #000; border-radius: 6px; padding: 1px 6px; vertical-align: 2px; }

  /* inbox */
  .req { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .req.new { border-color: #4a4a52; box-shadow: inset 3px 0 0 var(--fg); }
  .req.done { opacity: .45; }
  .req .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .req .type { font-weight: 700; }
  .req .what { font-size: 16px; }
  .req .reply { color: var(--dim); font-size: 14px; }
  .list { display: grid; gap: 10px; }

  /* settings */
  .form { display: grid; grid-template-columns: 170px 1fr; gap: 12px 16px; align-items: center; }
  .form > label { font-weight: 600; font-size: 14px; color: var(--dim); }
  .check { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; color: var(--fg); }
  .days { display: flex; gap: 4px; }
  .days button { width: 38px; padding: 7px 0; font-size: 12.5px; }
  @media (max-width: 640px) { .form { grid-template-columns: 1fr; gap: 6px; } .form > label { margin-top: 8px; } .modes .s { font-size: 11.5px; } }
  details summary { cursor: pointer; color: var(--dim); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }

  /* floating, so the page never shifts when it disappears (a shift mid-click would make you miss) */
  #banner { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 45; background: var(--fg); color: var(--on); padding: 10px 18px; border-radius: 999px; cursor: pointer; font-weight: 650; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.6); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--fg); color: var(--on); padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; font-weight: 650; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #alert { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #alert.open { display: flex; }
  #alert .card { max-width: 520px; width: 100%; }
  #login { max-width: 380px; margin: 14vh auto 0; }
  #lock { position: fixed; inset: 0; z-index: 80; background: var(--bg, #000); display: none; align-items: safe center; justify-content: center; padding: 16px; overflow-y: auto; }
  #lock.open { display: flex; }
  #lock .box { width: 100%; max-width: 320px; text-align: center; }
  #lock h2 { margin: 0 0 4px; }
  #lockDots { display: flex; gap: 14px; justify-content: center; margin: 22px 0 8px; }
  #lockDots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--dim); transition: .12s; }
  #lockDots i.on { background: var(--fg); border-color: var(--fg); }
  #lockDots.shake { animation: lockshake .35s; }
  @keyframes lockshake { 25% { transform: translateX(-9px); } 75% { transform: translateX(9px); } }
  #lockPad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 6px; }
  #lockPad button { padding: clamp(8px, 2.4vh, 16px) 0; font-size: 22px; font-weight: 600; border-radius: 14px; }
  @media (max-height: 640px) { #lockDots { margin: 12px 0 4px; } #lockPad { gap: 7px; margin: 8px 0 2px; } }
  #lockErr { min-height: 20px; color: var(--dim); font-size: 14px; margin: 6px 0; }
  .save { position: sticky; bottom: 14px; display: flex; justify-content: flex-end; }
  .save button { box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  select.tp, select.dp { padding: 8px 8px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .tpick { display: inline-flex; align-items: center; gap: 4px; }
  .tpick b { color: var(--dim); }
  .sub-h { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--mute); font-weight: 650; margin: 18px 0 10px; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .preset { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 12px; }
  .preset b { font-size: 16px; }
  .preset span { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .presets { grid-template-columns: repeat(2, 1fr); } }
  .row.appt .label { min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--s2); color: var(--dim); font-weight: 550; }
  .tag svg.i { width: 13px; height: 13px; }
  .tag.ok { color: var(--open); } .tag.bad { color: var(--closed); }
  table.people input { width: 100%; padding: 6px 8px; }
  table.people td { padding: 4px; }
  /* motion — transforms only, so nothing can stay invisible */
  @property --c { syntax: '<color>'; inherits: true; initial-value: #30d158; }
  html { transition: --c .8s ease; }
  #view.swap > * { animation: cardIn .4s cubic-bezier(.2,.8,.2,1); }
  #view.swap > :nth-child(2) { animation-delay: .03s; } #view.swap > :nth-child(3) { animation-delay: .06s; } #view.swap > :nth-child(n+4) { animation-delay: .09s; }
  @keyframes cardIn { from { transform: translateY(10px); opacity: .4; } }
  .req.enter { animation: reqIn .55s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes reqIn { from { transform: translateY(-12px) scale(.98); opacity: .3; } }
  #alert.open { animation: dimIn .2s ease-out; }
  @keyframes dimIn { from { background: rgba(0,0,0,0); } }
  #alert.open .card { animation: popIn .38s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes popIn { from { transform: translateY(14px) scale(.95); } }
  .mode, .preset, button { transition: background .2s, border-color .2s, color .2s, transform .15s cubic-bezier(.2,.8,.2,1.4), box-shadow .2s; }
  .mode:active, .preset:active { transform: scale(.97); }
  nav button { transition: color .2s, border-color .25s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  /* phones with a notch / home bar: keep content out of the unsafe areas */
  body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); -webkit-text-size-adjust: 100%; }
  .top { padding-top: env(safe-area-inset-top); }
  main { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  #toast { bottom: calc(78px + env(safe-area-inset-bottom)); } #banner { bottom: calc(18px + env(safe-area-inset-bottom)); }
  .lf { display: grid; gap: 10px; margin: 0; }
  .lf input { padding: 12px 14px; font-size: 16px; }
  .link-btn { background: none; border: 0; color: var(--dim); padding: 8px 0 0; font-size: 13.5px; text-decoration: underline; }
  #userBtn { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .permgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 14px; }
  .permgrid .check { align-items: flex-start; font-size: 14px; }
  .permgrid .check.off { opacity: .45; }
  .urow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .urow:first-of-type { border-top: 0; }
  .urow .who { flex: 1; min-width: 160px; }
  .urow .who b { display: block; }
  .chipline { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .editor { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; display: grid; gap: 12px; }
  pre.code { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 8px 0; user-select: all; }
  .keybox { background: color-mix(in srgb, var(--open) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--open) 40%, transparent); border-radius: 14px; padding: 14px; display: grid; gap: 8px; margin-bottom: 12px; }
  .keybox code { font: 14px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; user-select: all; }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; font-size: 14px; }
  .kv b { color: var(--dim); font-weight: 600; }
  @media (max-width: 640px) { .kv { grid-template-columns: 1fr; } .kv b { margin-top: 6px; } }
  input.bigin { font-size: 18px; padding: 14px 16px; border-radius: 12px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #soundBtn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #soundBtn.off { color: var(--closed); border-color: color-mix(in srgb, var(--closed) 45%, transparent); }
  @media (max-width: 560px) { #soundBtn .t { display: none; } }
  /* narrow phones: everything in the top bar must fit without making the page wider than the screen */
  @media (max-width: 520px) {
    .bar { flex-wrap: wrap; row-gap: 8px; gap: 8px; }
    .bar h1 { flex: 1 1 100%; order: -1; }
    .hide-sm { display: none; }
    #userBtn { max-width: 120px; }
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; font-weight: 500; }
  .stat b { font-size: 26px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { color: var(--dim); font-size: 13px; }
  .tl { margin-top: 14px; }
  .tli { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .tli.past { opacity: .4; }
  .tli.now .tlt { color: var(--busy); }
  .tlt { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 104px; }
  .tli svg { color: var(--dim); }
  .type { display: inline-flex; align-items: center; gap: 6px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .pophead { display: flex; gap: 14px; align-items: center; }
  .popicon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--s2); flex: none; }
  .popicon svg { width: 22px; height: 22px; }
  .poptitle { font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
  #alertCard.bellpop { box-shadow: 0 0 0 2px var(--fg), 0 24px 70px rgba(0,0,0,.7); }
  #alertCard.bellpop .popicon { background: var(--fg); color: var(--on); animation: shake .45s ease-in-out 4; }
  @keyframes shake { 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
</style>
</head>
<body>
<div id="banner" class="hidden">Klik ergens op deze pagina om het geluid aan te zetten</div>

<div id="login" class="card hidden">
  <h2>Bedieningspaneel</h2>
  <form id="userForm" class="lf">
    <input id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Gebruikersnaam">
    <input id="lp" name="password" type="password" autocomplete="current-password" placeholder="Wachtwoord">
    <label class="check" style="font-size:14px"><input type="checkbox" id="remember"><span id="rememberText">Onthoud mij op dit apparaat</span></label>
    <button class="white" id="loginBtn" type="submit">Inloggen</button>
  </form>
  <form id="codeForm" class="lf hidden">
    <p class="muted" style="margin:0">Open je verificatie-app en typ de code van 6 cijfers. Kwijt? Gebruik een herstelcode.</p>
    <input id="lc" name="code" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" placeholder="Code">
    <button class="white" id="codeBtn" type="submit">Bevestigen</button>
    <button class="link-btn" id="codeBack" type="button">Terug</button>
  </form>
  <button class="link-btn hidden" id="passkeyBtn" type="button">Inloggen met een passkey</button>
  <form id="pinForm" class="lf hidden">
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Pincode">
    <button class="white" id="pinBtn" type="submit">Ontgrendelen</button>
  </form>
  <button class="link-btn hidden" id="swapLogin" type="button"></button>
  <button class="link-btn hidden" id="appSettings" type="button">Server, IP of account wijzigen</button>
  <p class="muted" id="pinErr"></p>
</div>

<div id="lock" aria-modal="true" role="dialog">
  <div class="box">
    <h2>Vergrendeld</h2>
    <div class="muted">Voer je code van 6 cijfers in</div>
    <div id="lockDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="lockErr"></div>
    <div id="lockPad"></div>
    <button class="link-btn" id="lockOut" type="button">Uitloggen</button>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="powerBar" class="hidden"></div>
  <div class="top">
    <div class="bar">
      <h1 id="hName">Deur</h1>
      <span class="live"><span class="dot"></span><span id="hStatus"></span></span>
      <button class="sm ghost" id="soundBtn" title="Geluid aan/uit op dit apparaat"></button>
      <span id="conn" title="Live verbinding"></span>
      <button class="sm ghost hidden" id="lockBtn" title="Scherm vergrendelen">Vergrendel</button>
      <button class="sm ghost hidden" id="userBtn" title="Account"></button>
      <a href="/" target="_blank" rel="noopener" title="Deurscherm openen"><button class="sm ghost" id="doorLink"><span class="hide-sm">Deurscherm </span>↗</button></a>
    </div>
    <nav id="tabs"></nav>
  </div>
  <main id="view"></main>
</div>

<div id="alert"><div class="card" id="alertCard"></div></div>
<div id="toast"></div>

<script src="/tones.js"></script>
<script src="/qr.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let PIN = store.get('doorPin', '');
  let TOKEN = store.get('doorToken', '');
  const authHeaders = () => (TOKEN ? { authorization: 'Bearer ' + TOKEN } : PIN ? { 'x-pin': PIN } : {});
  const can = (p) => !!S?.me?.perms.includes(p);
  let S = null;
  let tab = store.get('doorTab', 'now');
  if (!['now', 'inbox', 'settings', 'design', 'admin', 'security', 'system'].includes(tab)) tab = 'now';
  let inboxFilter = 'open';
  let alertId = null;
  let es = null, lastMsg = 0;

  const COLORS_DARK = { open: '#30d158', closed: '#ff453a', busy: '#ff9f0a' };
  const COLORS_LIGHT = { open: '#1f9d55', closed: '#e0352b', busy: '#e8780c' };
  let COLORS = COLORS_DARK;
  // appearance of this control panel, per device: dark | light | auto (follows the computer)
  const sysLight = window.matchMedia('(prefers-color-scheme: light)');
  function applyTheme() {
    const pref = store.get('doorTheme', 'dark');
    const light = pref === 'light' || (pref === 'auto' && sysLight.matches);
    document.documentElement.classList.toggle('light', light);
    COLORS = light ? COLORS_LIGHT : COLORS_DARK;
    document.querySelector('meta[name=theme-color]').content = light ? '#f3f4f7' : '#000000';
    if (S) renderAll(true);
  }
  sysLight.addEventListener?.('change', applyTheme);
  applyTheme();
  // colours: the status colours and the accent come from the colour theme in the settings; this device may have its own look
  const hexOk = (c) => /^#[0-9a-f]{6}$/i.test(c || '');
  const lookColor = (mode) => {
    const st = S && S.settings, light = document.documentElement.classList.contains('light');
    if (st) { const own = light && hexOk(st.colorsLight && st.colorsLight[mode]) ? st.colorsLight[mode] : hexOk(st.colors && st.colors[mode]) ? st.colors[mode] : ''; if (own) return own; }
    return COLORS[mode];
  };
  const myLook = () => { try { return JSON.parse(store.get('doorLook', '{}')) || {}; } catch { return {}; } };
  function applyLook() {
    const root = document.documentElement, look = myLook();
    for (const m of ['open', 'closed', 'busy']) root.style.setProperty('--' + m, lookColor(m));
    const accent = hexOk(look.accent) ? look.accent : hexOk(S && S.settings && S.settings.accent) ? S.settings.accent : '';
    if (accent) {
      const n = parseInt(accent.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      root.style.setProperty('--accent', accent); root.style.setProperty('--on-accent', lum > 0.55 ? '#000' : '#fff');
    } else { root.style.removeProperty('--accent'); root.style.removeProperty('--on-accent'); }
    root.classList.toggle('compact', look.density === 'compact');
    root.classList.toggle('sharp', look.corners === 'sharp');
    document.body.style.zoom = String({ s: 0.92, m: 1, l: 1.12, xl: 1.25 }[look.size || 'm'] || 1);
  }
  const DAYS = ['Zo', 'Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za'];
  const TYPE = { bell: 'Aangebeld', reason: 'Verzoek', appointment: 'Afspraak', message: 'Vraagje', callback: 'Terugbellen' };
  const TYPE_ICON = { bell: 'bell', reason: 'msg', appointment: 'cal', message: 'msg', callback: 'phone' };
  const ICONS = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    bellOff: '<path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  };
  const icon = (n) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'i'); s.innerHTML = ICONS[n] || ICONS.msg; return s; };

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  }
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (t) => new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', hour12: false });
  const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function fmtWhen(t) {
    const diff = Math.round((dayStart(t) - dayStart(Date.now())) / 864e5);
    if (diff === 0) return fmt(t);
    if (diff === 1) return `morgen ${fmt(t)}`;
    return `${new Date(t).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })} ${fmt(t)}`;
  }
  const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? 'zojuist' : s < 3600 ? `${Math.floor(s / 60)} min geleden` : s < 86400 ? `${Math.floor(s / 3600)} uur geleden` : new Date(t).toLocaleDateString('nl-NL'); };
  const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const atLocal = (date, time) => new Date(`${date}T${time}`).getTime();
  const hmOf = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const nextHour = (plus = 1) => { const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + plus); return hmOf(d); };
  function timePicker(value, onChange, step = 5, key) {
    const [hh, mm] = (value || '09:00').split(':').map(Number);
    const mins = Array.from({ length: 60 / step }, (_, i) => i * step);
    if (!mins.includes(mm)) { mins.push(mm); mins.sort((a, b) => a - b); }
    const hSel = h('select', { class: 'tp', 'aria-label': 'uur', 'data-keep': key ? key + '-h' : null }, ...Array.from({ length: 24 }, (_, i) => h('option', { value: pad(i), selected: i === hh }, pad(i))));
    const mSel = h('select', { class: 'tp', 'aria-label': 'minuten', 'data-keep': key ? key + '-m' : null }, ...mins.map((m) => h('option', { value: pad(m), selected: m === mm }, pad(m))));
    const el = h('span', { class: 'tpick' }, hSel, h('b', {}, ':'), mSel);
    el.get = () => `${hSel.value}:${mSel.value}`;
    hSel.onchange = mSel.onchange = () => onChange && onChange(el.get());
    return el;
  }
  function dayLabel(t) {
    const diff = Math.round((dayStart(t) - dayStart(Date.now())) / 864e5);
    return diff === 0 ? 'Vandaag' : diff === 1 ? 'Morgen' : new Date(t).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function dayPicker(value, key) {
    const days = Array.from({ length: 21 }, (_, i) => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + i); return d; });
    if (value && !days.some((d) => ymd(d) === value)) days.unshift(new Date(`${value}T12:00`));
    return h('select', { class: 'dp', 'data-keep': key || null }, ...days.map((d) => h('option', { value: ymd(d), selected: ymd(d) === (value || ymd()) }, dayLabel(d.getTime()))));
  }
  function nextAt(hhmm) { const [hh, mm] = hhmm.split(':').map(Number); const t = new Date(); t.setHours(hh, mm, 0, 0); if (t <= new Date()) t.setDate(t.getDate() + 1); return t.getTime(); }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }

  async function api(path, body) {
    let res;
    try {
      res = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: body ? JSON.stringify(body) : undefined });
    } catch { toast('Geen verbinding met de deurserver'); throw new Error('offline'); }
    if (res.status === 401) { const had = TOKEN || PIN; TOKEN = ''; store.set('doorToken', ''); showLogin(had ? 'Je bent uitgelogd — log opnieuw in' : ''); throw new Error('auth'); }
    if (res.status === 423) { showLock(); throw new Error('locked'); }
    const out = await res.json().catch(() => ({}));
    if (!res.ok) { toast(out.error || 'Er ging iets mis'); throw new Error(out.error); }
    return out;
  }

  // ---------- login + live connection ----------
  let authInfo = { mode: 'login', pin: false };
  let autoLoginTried = false;
  // desktop app: sign in again by itself with the login that is stored encrypted on this computer
  async function autoLogin() {
    if (autoLoginTried || !window.doorApp?.loadLogin) return false;
    autoLoginTried = true;
    try {
      const saved = await window.doorApp.loadLogin();
      if (!saved) return false;
      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: saved.username, password: saved.password, remember: true }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { if (res.status === 401) window.doorApp.clearLogin(); return false; } // password changed: forget it
      if (out.needs2fa) return false; // the code has to be typed by hand
      TOKEN = out.token; PIN = ''; store.set('doorToken', TOKEN); store.set('doorPin', '');
      return true;
    } catch { return false; }
  }
  async function showLogin(msg) {
    if (await autoLogin()) { start(); return; }
    $('shell').classList.add('hidden'); $('login').classList.remove('hidden');
    $('rememberText').textContent = window.doorApp?.saveLogin ? 'Onthoud mijn inlog op deze computer (versleuteld)' : 'Onthoud mij op dit apparaat';
    $('remember').checked = store.get('doorRemember', window.doorApp?.saveLogin ? '1' : '0') === '1';
    $('pinErr').textContent = msg || '';
    if (es) { es.close(); es = null; }
    try { authInfo = await fetch('/api/auth-info', { cache: 'no-store' }).then((r) => r.json()); } catch {}
    $('appSettings').classList.toggle('hidden', !window.doorApp?.openSettings);
    $('appSettings').onclick = () => window.doorApp.openSettings();
    const pinOnly = authInfo.mode === 'pin';
    setLoginForm(pinOnly ? 'pin' : 'user');
    $('swapLogin').classList.toggle('hidden', pinOnly || !authInfo.pin);
    setTimeout(() => $(pinOnly ? 'pin' : 'lu').focus(), 50);
  }
  function setLoginForm(which) {
    $('userForm').classList.toggle('hidden', which !== 'user');
    $('codeForm').classList.toggle('hidden', which !== 'code');
    $('passkeyBtn').classList.toggle('hidden', which !== 'user' || !window.PublicKeyCredential);
    $('pinForm').classList.toggle('hidden', which !== 'pin');
    if (which === 'code') $('swapLogin').classList.add('hidden'); else if (authInfo.pin && authInfo.mode !== 'pin') $('swapLogin').classList.remove('hidden');
    $('swapLogin').textContent = which === 'user' ? 'Liever met een pincode inloggen' : 'Inloggen met gebruikersnaam';
    $('swapLogin').onclick = () => { setLoginForm(which === 'user' ? 'pin' : 'user'); $('pinErr').textContent = ''; setTimeout(() => $(which === 'user' ? 'pin' : 'lu').focus(), 30); };
  }
  $('userForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('loginBtn'); btn.disabled = true; $('pinErr').textContent = '';
    try {
      const typed = { username: $('lu').value, password: $('lp').value }, remember = $('remember').checked;
      store.set('doorRemember', remember ? '1' : '0');
      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...typed, remember }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { $('pinErr').textContent = out.error || 'Inloggen lukte niet'; $('lp').value = ''; $('lp').focus(); return; }
      if (out.needs2fa) { mfaTicket = out.mfa; mfaTyped = typed; mfaRemember = remember; $('lp').value = ''; setLoginForm('code'); $('lc').focus(); return; }
      TOKEN = out.token; PIN = ''; store.set('doorToken', TOKEN); store.set('doorPin', ''); $('lp').value = '';
      if (window.doorApp?.saveLogin) { if (remember) window.doorApp.saveLogin(typed.username, typed.password).then((r) => { if (r && !r.ok && r.error) toast(r.error); }); else window.doorApp.clearLogin(); }
      start();
    } catch { $('pinErr').textContent = 'Geen verbinding met de deurserver'; }
    finally { btn.disabled = false; }
  };
  let mfaTicket = '', mfaTyped = null, mfaRemember = false;
  $('codeBack').onclick = () => { mfaTicket = ''; $('lc').value = ''; $('pinErr').textContent = ''; setLoginForm('user'); };
  $('codeForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('codeBtn'); btn.disabled = true; $('pinErr').textContent = '';
    try {
      const res = await fetch('/api/login/2fa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mfa: mfaTicket, code: $('lc').value }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { $('pinErr').textContent = out.error || 'Die code werkt niet'; $('lc').value = ''; if (res.status === 429 || /verlopen/.test(out.error || '')) $('codeBack').click(); return; }
      TOKEN = out.token; PIN = ''; store.set('doorToken', TOKEN); store.set('doorPin', ''); $('lc').value = '';
      if (window.doorApp?.saveLogin && mfaTyped) { if (mfaRemember) window.doorApp.saveLogin(mfaTyped.username, mfaTyped.password); else window.doorApp.clearLogin(); }
      start();
    } catch { $('pinErr').textContent = 'Geen verbinding met de deurserver'; }
    finally { btn.disabled = false; }
  };
  // passkey: fingerprint / face / device code instead of a password (only on https or localhost, with a name instead of an IP address)
  const b64 = { to: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''), from: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)).buffer };
  $('passkeyBtn').onclick = async () => {
    $('pinErr').textContent = '';
    try {
      const o = await fetch('/api/login/passkey', { cache: 'no-store' }).then((r) => r.json());
      if (!o.available) { $('pinErr').textContent = o.why || 'Passkeys zijn hier niet beschikbaar.'; return; }
      const cred = await navigator.credentials.get({ publicKey: { challenge: b64.from(o.challenge), rpId: o.rpId, userVerification: 'required', timeout: 60000 } });
      const a = cred.response;
      const res = await fetch('/api/login/passkey', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ challenge: o.challenge, id: cred.id, clientDataJSON: b64.to(a.clientDataJSON), authenticatorData: b64.to(a.authenticatorData), signature: b64.to(a.signature), remember: $('remember').checked }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { $('pinErr').textContent = out.error || 'Deze passkey werkt niet'; return; }
      TOKEN = out.token; PIN = ''; store.set('doorToken', TOKEN); store.set('doorPin', ''); start();
    } catch (e) { $('pinErr').textContent = e && e.name === 'NotAllowedError' ? 'De passkey is geannuleerd.' : 'Inloggen met een passkey lukte niet.'; }
  };
  $('pinForm').onsubmit = (e) => { e.preventDefault(); PIN = $('pin').value.trim(); TOKEN = ''; store.set('doorToken', ''); store.set('doorPin', PIN); $('pin').value = ''; start(); };
  async function logout() {
    try { await fetch('/api/logout', { method: 'POST', headers: authHeaders() }); } catch {}
    TOKEN = ''; PIN = ''; store.set('doorToken', ''); store.set('doorPin', ''); S = null; closeAlert?.();
    autoLoginTried = true; if (window.doorApp?.clearLogin) window.doorApp.clearLogin();
    showLogin('');
  }

  function apply(data) {
    lastMsg = Date.now();
    if (S && data.peopleRev !== S.peopleRev) peopleDraft = null; // a visitor made a profile: show the fresh list
    S = data; renderAll(false);
    if (alertId && alertId !== 'test') {
      const r = S.requests.find((x) => x.id === alertId);
      if (!r || r.state === 'done' || (r.state === 'replied' && !r.autoReplied)) closeAlert();
    }
  }
  function connect() {
    if (es) es.close();
    es = new EventSource('/events?role=admin&' + (TOKEN ? 'token=' + encodeURIComponent(TOKEN) : 'pin=' + encodeURIComponent(PIN)));
    es.addEventListener('state', (e) => { try { apply(JSON.parse(e.data)); } catch {} });
    es.addEventListener('ping', () => { lastMsg = Date.now(); $('conn').classList.add('ok'); });
    es.addEventListener('visit', (e) => { try { onVisit(JSON.parse(e.data)); } catch {} });
    es.onopen = () => $('conn').classList.add('ok');
    es.onerror = () => $('conn').classList.remove('ok');
  }
  async function start() {
    // a one-time code from a QR code (#ticket=…): this device is logged in without typing anything
    const m = /[#&]ticket=([0-9a-f]{32})/.exec(location.hash || '');
    if (m) {
      history.replaceState(null, '', location.pathname + location.search);
      try {
        const r = await fetch('/api/login/ticket/use', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticket: m[1] }) });
        const out = await r.json();
        if (r.ok && out.token) { TOKEN = out.token; PIN = ''; store.set('doorToken', TOKEN); store.set('doorPin', ''); }
        else { showLogin(out.error || 'Die code werkt niet meer. Maak een nieuwe.'); return; }
      } catch { showLogin('Geen verbinding'); return; }
    }
    try { S = await api('/api/admin-state'); } catch { return; }
    lastMsg = Date.now();
    $('login').classList.add('hidden'); $('shell').classList.remove('hidden');
    renderAll(true);
    updateSoundUi();
    connect();
  }
  setInterval(async () => {
    if (!es || Date.now() - lastMsg < 45000) return;
    try { apply(await api('/api/admin-state')); connect(); } catch {}
  }, 10000);

  // ---------- visitor alerts: sound per device (on/off), pop-up always ----------
  const prefs = { sound: store.get('doorSound', '1') === '1', desktop: store.get('doorDesktop', '0') === '1' };
  const canNotify = 'Notification' in window && window.isSecureContext;
  let actx = null;
  const audioReady = () => !!actx && actx.state === 'running';
  // browsers only allow sound after you've clicked or typed on the page once
  function unlockAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state !== 'running') actx.resume().then(updateSoundUi, () => {});
    } catch {}
    updateSoundUi();
  }
  document.addEventListener('pointerdown', unlockAudio, { passive: true });
  document.addEventListener('keydown', unlockAudio);
  if (window.doorApp) unlockAudio(); // the desktop app may play sound right away

  function tone(f, t, len, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.05);
  }
  function chime(kind) {
    if (!prefs.sound) return;
    const snd = (S && S.settings && S.settings.sound) || {};
    if (kind === 'bell' && snd.bell === 'custom') { try { new Audio(`/api/bell-sound?v=${S.bellSoundV || 0}`).play().catch(() => {}); } catch {} return; }
    if (!actx) return;
    try {
      if (actx.state !== 'running') actx.resume().catch(() => {});
      if (kind === 'bell' && snd.bell && snd.bell !== 'none' && window.DoorTones) { // the chosen bell sound, twice
        window.DoorTones.play(actx, snd.bell, 0.4); setTimeout(() => window.DoorTones.play(actx, snd.bell, 0.4), 1100); return;
      }
      if (kind !== 'bell' && snd.reply === 'none') return;
      const t0 = actx.currentTime + 0.03;
      const notes = kind === 'bell'
        ? [[659.25, 0], [523.25, 0.45], [659.25, 1.35], [523.25, 1.8]]   // ding-dong, twice
        : [[880, 0], [1174.66, 0.16]];                                 // short "pling" for other requests
      for (const [f, o] of notes) tone(f, t0 + o, kind === 'bell' ? 1.4 : 0.6, kind === 'bell' ? 0.5 : 0.3);
    } catch {}
  }

  function updateSoundUi() {
    // update in place: rebuilding the button mid-click would swallow the click
    const btn = $('soundBtn');
    if (!btn.firstChild) btn.append(icon('bell'), h('span', { class: 't' }));
    btn.querySelector('svg').innerHTML = ICONS[prefs.sound ? 'bell' : 'bellOff'];
    btn.querySelector('.t').textContent = prefs.sound ? 'Geluid aan' : 'Geluid uit';
    btn.classList.toggle('off', !prefs.sound);
    $('banner').classList.toggle('hidden', !prefs.sound || audioReady() || $('shell').classList.contains('hidden'));
  }
  function setSound(on) {
    prefs.sound = on;
    store.set('doorSound', on ? '1' : '0');
    if (on) { unlockAudio(); chime('soft'); }
    updateSoundUi();
    toast(on ? 'Geluid aan' : 'Geluid uit — je krijgt alleen nog een pop-up');
    if (tab === 'settings') renderAll(true);
  }
  $('soundBtn').onclick = () => setSound(!prefs.sound);
  $('banner').onclick = () => { unlockAudio(); setTimeout(() => chime('soft'), 50); };

  const what = (r) => [r.topic, r.reason, r.at && `wil ${fmtWhen(r.at)}`, r.when && `terugbellen: ${r.when}`, r.message && `“${r.message}”`].filter(Boolean).join(' · ');

  // ----- energy: the countdown bar (always visible for people who may stop it) and the Energie card -----
  const PWR_TEXT = { computer: 'De computer gaat uit', hibernate: 'De computer gaat in slaapstand', restart: 'De computer herstart' };
