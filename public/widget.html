<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status</title>
<style>
html, body { margin:0; background:transparent; font:600 15px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
#w { display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border-radius:999px; background:#1c1c1e; color:#fff; }
#w i { width:12px; height:12px; border-radius:50%; background:#8e8e93; display:block; } #w small { color:#aaa; font-weight:500; }
</style></head><body><div id="w" hidden><i id="dot"></i><span id="txt"></span><small id="msg"></small></div>
<script>
(async function tick() {
  try {
    const r = await fetch('/status.json', { cache: 'no-store' });
    if (r.ok) {
      const s = await r.json(), c = { open: '#30d158', closed: '#ff453a', busy: '#ff9f0a' }[s.mode] || '#8e8e93';
      document.getElementById('dot').style.background = c; document.getElementById('dot').style.boxShadow = '0 0 8px ' + c;
      document.getElementById('txt').textContent = (s.name ? s.name + ': ' : '') + s.label; document.getElementById('msg').textContent = s.message || '';
      document.getElementById('w').hidden = false;
    }
  } catch {}
  setTimeout(tick, 20000);
})();
</script></body></html>
