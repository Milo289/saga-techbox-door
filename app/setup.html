<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
<title>Instellingen — Saga Techbox Deur</title>
<style>
  :root { --bg: #f3f4f7; --card: #fff; --s2: #eef0f3; --line: #e1e4ea; --fg: #15171b; --dim: #5b616c; --acc: #1f9d55; --err: #e0352b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #0e0e10; --s2: #18181b; --line: #26262a; --fg: #f5f5f7; --dim: #a1a1aa; --acc: #30d158; --err: #ff453a; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 22px 40px; display: grid; gap: 18px; }
  header { display: flex; align-items: center; gap: 14px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 16px var(--acc); }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  .ver { color: var(--dim); font-size: 13px; }
  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 6px 0 -6px; font-weight: 650; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { position: relative; display: block; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; }
  .opt b { display: block; font-size: 16px; }
  .opt span { color: var(--dim); font-size: 13px; }
  .opt:has(input:checked) { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 18%, transparent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  input[type=text], input[type=number], input[type=password] { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--s2); color: var(--fg); outline: none; width: 100%; }
  input:focus { border-color: var(--acc); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > .grow { flex: 1; }
  .hint { color: var(--dim); font-size: 13px; margin: 0; }
  .hint code { background: var(--s2); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; user-select: all; }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; background: var(--s2); color: var(--fg); }
  button.go { background: var(--fg); color: var(--bg); width: 100%; padding: 14px; font-size: 16px; }
  button:disabled { opacity: .5; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 500; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--acc); }
  .ok { color: var(--acc); font-weight: 600; } .bad { color: var(--err); font-weight: 600; }
  .err { color: var(--err); font-weight: 600; min-height: 1.2em; margin: 0; }
  .hidden { display: none !important; }
  @media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header><div class="dot"></div><div><h1>Saga Techbox Deur</h1><div class="ver" id="ver"></div></div></header>

  <h2>Wat doet deze computer?</h2>
  <div class="opts">
    <label class="opt"><input type="radio" name="role" value="door"><b>Deurscherm</b><span>Toont het deurscherm schermvullend op deze monitor.</span></label>
    <label class="opt"><input type="radio" name="role" value="control"><b>Bedieningspaneel</b><span>Status zetten en bezoekers beantwoorden, met meldingen.</span></label>
  </div>

  <h2>Waar draait de deurserver?</h2>
  <div class="opts">
    <label class="opt"><input type="radio" name="mode" value="here"><b>Op deze computer</b><span>Alles in één. Andere apparaten verbinden met deze computer.</span></label>
    <label class="opt"><input type="radio" name="mode" value="remote"><b>Ergens anders</b><span>Bijv. een Raspberry Pi of een server met Docker.</span></label>
  </div>

  <div class="card" id="hereBox">
    <div class="row">
      <label class="f grow">Pincode voor het bedieningspaneel<input type="password" id="pin" inputmode="numeric" maxlength="32" placeholder="Leeg = geen pincode"></label>
      <label class="f" style="width:110px">Poort<input type="number" id="port" min="1024" max="65535"></label>
    </div>
    <p class="hint" id="lan"></p>
  </div>

  <div class="card hidden" id="remoteBox">
    <label class="f">Adres van de deurserver
      <div class="row"><input type="text" id="url" class="grow" placeholder="http://192.168.1.50:8080" spellcheck="false"><button id="test" type="button">Test</button></div>
    </label>
    <p class="hint" id="testResult">Het adres staat bovenaan in het bedieningspaneel van de server, of vraag het aan wie de server heeft opgezet.</p>
  </div>

  <label class="check"><input type="checkbox" id="autostart"> Automatisch starten als de computer opstart</label>

  <p class="err" id="err"></p>
  <button class="go" id="save">Opslaan en starten</button>
  <p class="hint" id="keys"></p>
</main>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const info = await window.setup.get();
  const c = info.config;
  const mod = info.platform === 'darwin' ? 'Cmd' : 'Ctrl';
  $('ver').textContent = `Versie ${info.version}`;
  $('keys').textContent = `Sneltoetsen: ${mod}+Shift+S opent deze instellingen, ${mod}+Shift+Q sluit de app af (ook op het deurscherm).`;

  const radio = (name, value) => { const r = document.querySelector(`input[name=${name}][value=${value}]`); if (r) r.checked = true; };
  const val = (name) => document.querySelector(`input[name=${name}]:checked`)?.value;
  radio('role', c.role || 'door');
  radio('mode', c.serverMode || 'here');
  $('pin').value = c.pin || '';
  $('port').value = c.port || 8080;
  $('url').value = c.url || '';
  $('autostart').checked = c.autostart !== false;

  const showLan = () => {
    const port = parseInt($('port').value, 10) || 8080;
    const addrs = info.lan.map((u) => u.replace(/:\d+$/, ':' + port));
    $('lan').innerHTML = '';
    $('lan').append(addrs.length ? 'Op andere apparaten in dit netwerk: ' : 'Deze computer heeft nog geen netwerkverbinding.');
    addrs.forEach((u, i) => { const code = document.createElement('code'); code.textContent = u + '/admin'; $('lan').append(i ? ' of ' : '', code); });
  };
  const sync = () => {
    const remote = val('mode') === 'remote';
    $('hereBox').classList.toggle('hidden', remote);
    $('remoteBox').classList.toggle('hidden', !remote);
    $('err').textContent = '';
  };
  document.querySelectorAll('input[name=mode]').forEach((r) => r.addEventListener('change', sync));
  $('port').addEventListener('input', showLan);
  sync(); showLan();

  $('test').onclick = async () => {
    $('testResult').textContent = 'Testen…'; $('testResult').className = 'hint';
    const ok = await window.setup.test($('url').value.trim());
    $('testResult').textContent = ok ? 'Verbonden met de deurserver ✓' : 'Geen deurserver gevonden op dit adres.';
    $('testResult').className = ok ? 'hint ok' : 'hint bad';
  };

  $('save').onclick = async () => {
    $('save').disabled = true; $('err').textContent = '';
    const res = await window.setup.save({
      role: val('role'), serverMode: val('mode'), url: $('url').value.trim(),
      port: $('port').value, pin: $('pin').value, autostart: $('autostart').checked,
    });
    if (!res || !res.ok) { $('err').textContent = (res && res.error) || 'Opslaan lukte niet.'; $('save').disabled = false; }
  };
})();
</script>
</body>
</html>
