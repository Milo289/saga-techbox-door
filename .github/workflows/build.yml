# Builds the desktop app on macOS, Windows and Linux.
#  • Push a tag like v1.0.1  -> builds everything and publishes a Release with the installers.
#  • "Run workflow" button on the Actions tab -> builds and keeps the installers as downloadable artifacts.
name: Build app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the code
        run: node --check server.js && node --check app/main.js
      - name: Build installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no paid code-signing certificate
      # Start the real built app and check that it works (server inside the app, login, screen, closes again).
      - name: Test the built app (macOS)
        if: runner.os == 'macOS'
        run: node scripts/smoke.js "dist/mac-arm64/Saga Techbox Deur.app/Contents/MacOS/Saga Techbox Deur"
      - name: Test the built app (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke.js "dist/win-unpacked/Saga Techbox Deur.exe"
      - name: Test the built app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.js "dist/linux-unpacked/saga-techbox-door" --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: Saga-Techbox-Deur-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  # iPhone / iPad app (Swift). Built without a signature: you sign it yourself when you install it (see INSTALL.md).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (iPhone)
        working-directory: ios
        run: >
          xcodebuild -project DeurBeheer.xcodeproj -scheme DeurBeheer -configuration Release -sdk iphoneos
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Check that the simulator version builds too
        working-directory: ios
        run: >
          xcodebuild -project DeurBeheer.xcodeproj -scheme DeurBeheer -configuration Debug -sdk iphonesimulator
          -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
      - name: Make the .ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DeurBeheer.app Payload/
          zip -qry ../Saga-Techbox-Beheer-iOS-unsigned.ipa Payload
          ls -la ../Saga-Techbox-Beheer-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Saga-Techbox-Beheer-iOS
          if-no-files-found: error
          path: Saga-Techbox-Beheer-iOS-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
