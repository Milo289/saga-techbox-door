# Builds the desktop app on macOS, Windows and Linux.
#  • Push a tag like v1.0.1  -> builds everything and publishes a Release with the installers.
#  • "Run workflow" button on the Actions tab -> builds and keeps the installers as downloadable artifacts.
name: Build app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the code
        run: node --check server.js && node --check app/main.js
      - name: Build installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no paid code-signing certificate
      - uses: actions/upload-artifact@v4
        with:
          name: Saga-Techbox-Deur-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
