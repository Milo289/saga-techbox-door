name: Eigen Linux
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y live-build
      - run: sudo ./linux-iso/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-iso
          path: Saga-Techbox-Deur-OS-amd64.iso
      - name: Add it to the release (once the release exists)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" Saga-Techbox-Deur-OS-amd64.iso --clobber && exit 0
            fi
            sleep 60
          done
          echo "release not found"; exit 1
