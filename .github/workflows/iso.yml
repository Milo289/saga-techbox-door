name: Eigen Linux
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: i386, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y debootstrap debian-archive-keyring squashfs-tools xorriso mtools dosfstools cpio
      - name: A recent live-build (the Ubuntu one is too old for Debian images)
        run: |
          curl -fsSLo /tmp/lb.deb http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i --force-depends /tmp/lb.deb
          lb --version
      - run: sudo ARCH=${{ matrix.arch }} ./linux-iso/build.sh
      # The ISO goes to a release page (not to the build artifacts: those have a download limit and fill up quickly).
      # A version tag (v...) uses that version's release; a manual run uses the release "iso-latest".
      - name: Put the ISO on a release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=Saga-Techbox-Deur-OS-${{ matrix.arch }}.iso
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 60; done
          else
            TAG=iso-latest
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${GITHUB_SHA}" --prerelease --title "Eigen Linux (laatste proefversie)" --notes "Automatisch gemaakt bij elke proefbouw van de Linux-schijf. Alleen om uit te proberen." || true
          fi
          gh release upload "$TAG" "$FILE" --clobber
      - name: Opstarttest (boots the ISO in a virtual computer, waits for the server, takes a screenshot)
        if: matrix.arch == 'amd64'
        timeout-minutes: 15
        run: |
          sudo apt-get install -y qemu-system-x86 socat imagemagick
          ACCEL=tcg; [ -w /dev/kvm ] && ACCEL=kvm
          qemu-system-x86_64 -accel $ACCEL -m 3072 -smp 2 -cdrom Saga-Techbox-Deur-OS-amd64.iso -boot d -vga std -display none -serial file:/tmp/serial.log -monitor unix:/tmp/qemu.sock,server,nowait -nic user,hostfwd=tcp::8080-:8080 > /tmp/qemu.log 2>&1 &
          QPID=$!
          ok=0
          sleep 15; echo "sendkey ret" | timeout 5 socat - UNIX-CONNECT:/tmp/qemu.sock || true   # in case the boot menu still waits
          for i in $(seq 1 72); do
            if curl -fs --max-time 4 http://localhost:8080/healthz; then echo " <- de server antwoordt na ongeveer $((i*5)) seconden"; ok=1; break; fi
            sleep 5
          done
          sleep 60
          echo "screendump /tmp/screen.ppm" | timeout 10 socat - UNIX-CONNECT:/tmp/qemu.sock || true
          sleep 2
          timeout 30 convert /tmp/screen.ppm screen-amd64.png || true
          cp /tmp/serial.log serial-amd64.log 2>/dev/null || true
          kill $QPID || true
          [ "$ok" = 1 ] || { echo "De server antwoordde niet binnen 6 minuten"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'amd64'
        with:
          name: boot-screenshot
          path: |
            screen-amd64.png
            serial-amd64.log
          if-no-files-found: ignore
