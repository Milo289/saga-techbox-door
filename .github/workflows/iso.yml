name: Eigen Linux
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: i386, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y debootstrap debian-archive-keyring squashfs-tools xorriso mtools dosfstools cpio
      - name: A recent live-build (the Ubuntu one is too old for Debian images)
        run: |
          curl -fsSLo /tmp/lb.deb http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i --force-depends /tmp/lb.deb
          lb --version
      - run: sudo ARCH=${{ matrix.arch }} ./linux-iso/build.sh
      - name: Opstarttest (boots the ISO in a virtual computer and waits for the server)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y qemu-system-x86
          ACCEL=tcg; [ -w /dev/kvm ] && ACCEL=kvm
          qemu-system-x86_64 -accel $ACCEL -m 2048 -smp 2 -cdrom Saga-Techbox-Deur-OS-amd64.iso -boot d -display none -nic user,hostfwd=tcp::8080-:8080 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/healthz; then echo " <- de server antwoordt na ongeveer $((i*5)) seconden"; exit 0; fi
            sleep 5
          done
          echo "De server antwoordde niet binnen 5 minuten"; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-iso-${{ matrix.arch }}
          path: Saga-Techbox-Deur-OS-${{ matrix.arch }}.iso
      - name: Add it to the release (once the release exists)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" Saga-Techbox-Deur-OS-${{ matrix.arch }}.iso --clobber && exit 0
            fi
            sleep 60
          done
          echo "release not found"; exit 1
