name: DeurBeheer
options:
  bundleIdPrefix: nl.sagatechbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info*.plist"]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Deur Beheer vergrendelt zich met Face ID, zodat alleen jij erin kunt.
        NSLocalNetworkUsageDescription: Deur Beheer maakt verbinding met jouw deurserver in het netwerk.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: nl.sagatechbox.beheer.open
            UIApplicationShortcutItemTitle: Deur open
            UIApplicationShortcutItemIconSymbolName: door.left.hand.open
          - UIApplicationShortcutItemType: nl.sagatechbox.beheer.closed
            UIApplicationShortcutItemTitle: Deur gesloten
            UIApplicationShortcutItemIconSymbolName: door.left.hand.closed
          - UIApplicationShortcutItemType: nl.sagatechbox.beheer.busy
            UIApplicationShortcutItemTitle: Bezet
            UIApplicationShortcutItemIconSymbolName: clock
          - UIApplicationShortcutItemType: nl.sagatechbox.beheer.lockdown
            UIApplicationShortcutItemTitle: Noodstop
            UIApplicationShortcutItemIconSymbolName: exclamationmark.octagon
  MacApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Mac
      - path: App/Api.swift
      - path: App/Store.swift
      - path: App/Models.swift
      - path: App/JSON.swift
      - path: App/Keychain.swift
      - path: App/Prefs.swift
      - path: App/Theme.swift
      - path: App/Discovery.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Deur Beheer maakt verbinding met jouw deurserver in het netwerk.
        INFOPLIST_KEY_NSHumanReadableCopyright: Saga Techbox
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.0"
targets:
  DeurBeheer:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sagatechbox.beheer
        PRODUCT_NAME: DeurBeheer
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Deur Beheer
  # the developer app: installs next to the normal one, with the Ontwikkelaar tab always on
  DeurBeheerDev:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sagatechbox.beheer.dev
        PRODUCT_NAME: DeurBeheerDev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEVELOPER"
    info:
      path: App/Info-Dev.plist
      properties:
        CFBundleDisplayName: Deur Dev
  # the Mac apps: own window with a sidebar and a menu bar item, sharing the server code with the iPhone app
  DeurBeheerMac:
    templates: [MacApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sagatechbox.beheer.mac
        PRODUCT_NAME: DeurBeheer
        INFOPLIST_KEY_CFBundleDisplayName: Deur Beheer
  # the developer Mac app: installs next to the normal one, with the Ontwikkelaar page (API console, raw data, event log)
  DeurBeheerMacDev:
    templates: [MacApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sagatechbox.beheer.mac.dev
        PRODUCT_NAME: DeurBeheerDev
        INFOPLIST_KEY_CFBundleDisplayName: Deur Dev
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEVELOPER"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
schemes:
  DeurBeheerMacDev:
    build:
      targets:
        DeurBeheerMacDev: all
    run:
      config: Debug
  DeurBeheer:
    build:
      targets:
        DeurBeheer: all
    run:
      config: Debug
  DeurBeheerMac:
    build:
      targets:
        DeurBeheerMac: all
    run:
      config: Debug
  DeurBeheerDev:
    build:
      targets:
        DeurBeheerDev: all
    run:
      config: Debug
