#!/usr/sbin/nft -f
# The door computer only answers what it has to: the panel and door screen (8080, and 8443 for https), finding it on the network, and ping.
flush ruleset
table inet saga {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip protocol igmp accept   # the router asks "who still listens to multicast?"; without an answer the network stops sending the name lookups (mDNS)
    ip6 nexthdr icmpv6 accept
    tcp dport { 8080, 8443 } accept
    udp dport { 41234, 5353, 68, 546 } accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
